  <nav class="app-nav" aria-label="Main navigation">
    <a class="{{ 'active' if page=='dashboard' else '' }}" href="{{ url_for('dashboard') }}">Overview</a>
    <a class="{{ 'active' if page=='journal' else '' }}" href="{{ url_for('journal') }}">Symptom Journal</a>
    <a class="{{ 'active' if page=='calendar' else '' }}" href="{{ url_for('calendar_page') }}">Symptom Calendar</a>

  <div class="sidebar-user">
    <a class="sidebar-user-profile" href="{{ url_for('profile') }}" aria-label="Open My Profile">

      <span class="sidebar-profile-mark">↗</span>

      <button class="sidebar-logout" type="submit">Log out</button>
